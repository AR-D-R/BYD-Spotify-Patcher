name: Build Windows Release

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Show environment
        shell: pwsh
        run: |
          python --version
          java -version
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host "ANDROID_SDK_ROOT=$env:ANDROID_SDK_ROOT"

      - name: Check Android Build Tools
        shell: pwsh
        run: |
          if (-not $env:ANDROID_HOME) {
            throw "ANDROID_HOME is not available on this runner."
          }

          $env:ANDROID_SDK_ROOT = $env:ANDROID_HOME
          "ANDROID_SDK_ROOT=$env:ANDROID_HOME" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "Installed build-tools:"
          Get-ChildItem "$env:ANDROID_HOME\build-tools" -Directory

      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build portable EXE
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass
          .\build_portable_windows.ps1

      - name: Prepare release files
        shell: pwsh
        run: |
          $Version = "${{ github.ref_name }}"

          if (-not $Version -or $Version -eq "main") {
            $Version = "dev"
          }

          $ExeName = "BYDSpotifyPatcher-$Version-Windows-x64.exe"

          Copy-Item `
            ".\dist\BYDSpotifyPatcher.exe" `
            ".\$ExeName"

          $Hash = (
            Get-FileHash ".\$ExeName" -Algorithm SHA256
          ).Hash.ToLower()

          "$Hash  $ExeName" |
            Out-File ".\SHA256SUMS.txt" -Encoding ascii

          "RELEASE_EXE=$ExeName" |
            Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host ""
          Write-Host "Release binary:"
          Write-Host $ExeName
          Write-Host ""
          Write-Host "SHA256:"
          Write-Host $Hash

      - name: Generate build provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.RELEASE_EXE }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BYDSpotifyPatcher-Windows
          path: |
            ${{ env.RELEASE_EXE }}
            SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "${{ env.RELEASE_EXE }}" `
            "SHA256SUMS.txt" `
            --title "BYD Spotify Patcher ${{ github.ref_name }}" `
            --generate-notes